/* Days Gone-style loading screen: the key art full-bleed, logo top left, and bottom left a big LOADING, the MB count and a glass
   tube that fills with purple liquid. One dark look, like the game's menus (black + purple). */
:root { color-scheme: dark; --void: #050407; --ink: #f1ecff; --dim: #a79fbd; --purple: #a974ff; --deep: #5a22c9; --bad: #ff6a5a; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); overflow: hidden; overscroll-behavior: none; font: 500 16px/1.4 "DD Saira", "Saira Extra Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
#stage { position: relative; width: 100%; height: 100%; min-height: 240px; background: var(--void); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: var(--void); }
#wait { position: absolute; inset: 0; background: var(--void) center / cover no-repeat; transition: opacity .7s; }
#wait::before { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(5,4,10,.92) 0%, rgba(5,4,10,.55) 28%, rgba(5,4,10,0) 55%), linear-gradient(90deg, rgba(5,4,10,.55) 0%, rgba(5,4,10,0) 45%); }
#wait.gone { opacity: 0; pointer-events: none; }
#logo { position: absolute; left: max(16px, 4vw); top: max(14px, 4vh); width: min(280px, 38vw); filter: drop-shadow(0 4px 14px rgba(0,0,0,.6)); }
#panel { position: absolute; left: max(16px, 5vw); right: max(16px, 5vw); bottom: max(18px, 7vh); max-width: 600px; display: flex; flex-direction: column; gap: 10px; }
#row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

    setWord('Starting'); tube.set(0.92);
    // (the screen is drawn at a lower sharpness than the display: far fewer pixels to fill each frame, so it runs much smoother, and it still looks the same)
    var config = { frameworkUrl: frameworkUrl, streamingAssetsUrl: G + 'StreamingAssets', companyName: M.company || 'Midnight Grid Studios', productName: M.product, productVersion: M.version || '1.0',
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 1.25), matchWebGLToCanvasSize: true,
      showBanner: function (msg, type) { if (type === 'error') fail(msg); else if (window.console) console.warn(msg); } };
    var real = window.fetch.bind(window); names = { 'g/whole.data': files.data, 'g/whole.wasm': files.code };
    window.fetch = function (input, init) {
      var u = typeof input === 'string' ? input : input && input.url ? input.url : String(input);
      for (var k in names) if (u.length >= k.length && u.substr(u.length - k.length) === k) { var f = names[k]; return Promise.resolve(new Response(f.buf ? f.buf.slice(0) : f, { status: 200, headers: { 'Content-Type': f.type, 'Content-Length': String(f.size) } })); }
      return real(input, init);
    };
    config.dataUrl = 'g/whole.data'; config.codeUrl = 'g/whole.wasm';
    if (typeof createUnityInstance === 'undefined') await script(G + 'loader.js' + VQ);
    var instance = await createUnityInstance(canvas, config, function (p) { tube.set(0.92 + 0.08 * p); });
    window.unityInstance = instance; try { window.name = ''; } catch (e) { }
    kept = {}; names = {}; files = null; done();
  })().catch(function (err) {
    if (window.console) console.error(err); kept = {};
    var n = parseInt((/ddTry(\d)/.exec(window.name || '') || [0, '0'])[1], 10);
    if (n < 2) { try { window.name = 'ddTry' + (n + 1); setWord('One moment'); setTimeout(function () { location.reload(); }, 600); return; } catch (e) { } }
    try { window.name = ''; } catch (e) { }
    fail('The game could not start this time. Tap TRY AGAIN and it will start fresh.');
  }); }
  run();
})();
